name: Build QQRepeatFresh

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz make dpkg || true

      - name: Setup Theos
        run: |
          sudo rm -rf /opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo rm -rf /opt/theos/sdks
          sudo git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks
          ls /opt/theos/sdks | head

      - name: Build
        run: |
          set -o pipefail
          export THEOS=/opt/theos
          make clean || true
          make -j4 FINALPACKAGE=1 2>&1 | tee build.log
          make package FINALPACKAGE=1 2>&1 | tee -a build.log || true

      - name: Show build log on failure
        if: failure()
        run: |
          echo "===== build.log ====="
          cat build.log || true

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          FAT=".theos/_/Library/MobileSubstrate/DynamicLibraries/QQRepeatFresh.dylib"
          if [ -f "$FAT" ]; then
            cp "$FAT" out/QQRepeatFresh.dylib
          else
            echo "staged dylib not found, searching..."
            find .theos -name 'QQRepeatFresh.dylib' -print
            FIRST=$(find .theos -name 'QQRepeatFresh.dylib' | head -1)
            cp "$FIRST" out/QQRepeatFresh.dylib
          fi
          ls -l out
          lipo -info out/QQRepeatFresh.dylib
          lipo -archs out/QQRepeatFresh.dylib
          find . -maxdepth 2 -name '*.deb' -exec cp {} out/ \;
          cd out && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QQRepeatFresh-artifacts
          path: out/
          if-no-files-found: error
